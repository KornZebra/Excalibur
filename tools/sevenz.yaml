name: "sevenz"
command: "7z"
args: ["x"]
enabled: true
short_description: "7-Zip 解压：archive + 输出目录/口令/覆盖确认"
description: |
  默认行为：以解压模式（x，保留目录结构）处理 7z/zip/rar/tar/gz 等多种压缩包。
  参数：archive 为待解压文件（必填，走位置参数追加到命令末尾）；
  output_dir 指定输出目录（-o，注意 7z 的 -o 后不加空格，如 -o{{WORKSPACE}}/out）；
  password 提供口令（-p）；yes 为 true 时对所有询问自动回答 yes（-y，
  避免覆盖确认交互导致挂死）；
  additional_args 追加原始参数（如 -l 仅列表、-so 输出到 stdout）。
  常见坑：不加 -y 且目标已存在时会询问是否覆盖，可能挂死，本配方默认建议加 yes；
  7z 也支持 rar，但 rar 需系统安装 unrar 后端；解压前先用 7z l 查看内容，
  警惕压缩包内的路径穿越（../）与超大解压炸弹。
  示例：7z l {{WORKSPACE}}/chall.7z
        7z x -o{{WORKSPACE}}/sevenz_out -y {{WORKSPACE}}/chall.7z
parameters:
  - name: "archive"
    type: "string"
    description: "待解压的压缩包路径"
    required: true
    format: "positional"
  - name: "output_dir"
    type: "string"
    description: "输出目录（-o），-o 后不加空格"
    flag: "-o"
    required: false
  - name: "password"
    type: "string"
    description: "压缩包口令（-p）"
    flag: "-p"
    required: false
  - name: "yes"
    type: "boolean"
    description: "为 true 时自动确认所有询问（-y），避免覆盖时挂起"
    flag: "-y"
    required: false
  - name: "additional_args"
    type: "string"
    description: "追加的原始参数，如 -l 或 -so"
    format: "positional"
    required: false
category: "forensics"
requires_root: false
dangerous: false
notes: "不加 -y 时覆盖确认可能挂死；注意压缩包路径穿越与解压炸弹"